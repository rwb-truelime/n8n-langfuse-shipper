services:
  shipper:
    build: .
    image: tlteamai.azurecr.io/truelime/n8n-langfuse-shipper:latest
    env_file: .env
    network_mode: host
    environment:
      # Override checkpoint path for container volume mount
      CHECKPOINT_FILE: /data/.shipper_checkpoint
    volumes:
      - ./data:/data
    # Override default dry-run to perform real export (remove --no-dry-run for dry runs)
    command: ["--limit", "100", "--no-dry-run"]
    restart: "no"
